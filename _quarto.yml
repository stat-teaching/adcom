  render:
    - "*.qmd"
    - "!local/"
    - "slides/exploring-data.qmd"
  pre-render:
    - quarto-scripts/papers.r
  #   - quarto-scripts/slide2pdf.r
  resources:
    papers/*.pdf

website:
  favicon: resources/hex.svg
  title: "ADCOM"
  navbar:
    #background: "#786fa6"
    search: true
    right:
      - icon: github
        href: https://github.com/stat-teaching/adcom
        aria-label: GitHub

author: 
  - name: "Filippo Gambarota PhD"
    email: filippo.gambarota@unipd.it
    twitter: fgambarota
    github: filippogambarota
    orcid: "0000-0002-6666-1747"

institute: "Università di Padova"

execute: 
  freeze: auto

format:
  html:
    theme:
      - pulse
      - brand
    css: styles.css
    toc: true

bibliography: "https://raw.githubusercontent.com/filippogambarota/bib-database/main/references.bib"
